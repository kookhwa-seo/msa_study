server:
  port: 8085

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      # React 프런트엔드(Vite 개발 서버, localhost:5173)가 브라우저에서 직접 호출하는
      # 유일한 지점이라 CORS는 여기서만 열어주면 된다 — 게이트웨이 뒤 서비스 간 호출은
      # 서버 간 통신이라 CORS와 무관하다.
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:5173"
            allowedMethods: "*"
            allowedHeaders: "*"
      routes:
        # 비즈니스 API는 reservation-service·vehicle-service(지점 목록 조회)·llm-service뿐이다.
        # payment는 Kafka 컨슈머 전용이라 REST API가 없지만 actuator는 떠 있어서 헬스체크만
        # 라우팅한다. notification-service는 starter-web조차 없는 순수 컨슈머라 라우팅할 HTTP
        # 대상 자체가 없어 제외한다.
        - id: reservation-api
          uri: http://localhost:8081
          predicates:
            - Path=/api/reservations/**
        - id: vehicle-branches-api
          uri: http://localhost:8082
          predicates:
            - Path=/api/branches/**
        - id: llm-chat-api
          uri: http://localhost:8086
          predicates:
            - Path=/api/chat/**
        - id: reservation-health
          uri: http://localhost:8081
          predicates:
            - Path=/services/reservation/**
          filters:
            - StripPrefix=2
        - id: vehicle-health
          uri: http://localhost:8082
          predicates:
            - Path=/services/vehicle/**
          filters:
            - StripPrefix=2
        - id: payment-health
          uri: http://localhost:8083
          predicates:
            - Path=/services/payment/**
          filters:
            - StripPrefix=2

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
