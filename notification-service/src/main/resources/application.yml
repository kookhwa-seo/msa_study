server:
  port: 8084

spring:
  application:
    name: notification-service
  kafka:
    bootstrap-servers: localhost:9092
    # notification-service는 원래 이벤트를 발행하지 않지만, DLT(Dead Letter Topic)
    # 발행에 KafkaTemplate이 필요해 producer 직렬화 설정을 둔다.
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest

# reservationId(Saga 상관관계 ID)를 MDC에서 읽어 로그 레벨 옆에 노출한다.
# Zipkin 없이도, 이 값으로 여러 서비스의 로그를 grep해서 하나의 Saga 흐름을 추적할 수 있다.
logging:
  pattern:
    level: "%5p [${spring.application.name},%X{reservationId:-}]"
