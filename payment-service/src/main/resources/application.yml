server:
  port: 8083

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://localhost:5434/payment
    username: payment
    password: payment
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: payment-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

management:
  endpoints:
    web:
      exposure:
        include: health,info

# reservationId(Saga 상관관계 ID)를 MDC에서 읽어 로그 레벨 옆에 노출한다.
# Zipkin 없이도, 이 값으로 여러 서비스의 로그를 grep해서 하나의 Saga 흐름을 추적할 수 있다.
logging:
  pattern:
    level: "%5p [${spring.application.name},%X{reservationId:-}]"

app:
  payment:
    # 이 금액을 초과하는 예약은 결제 실패(INSUFFICIENT_LIMIT)로 시뮬레이션한다.
    fail-above-amount: 1000000
