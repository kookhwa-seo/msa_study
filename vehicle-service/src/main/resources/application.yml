server:
  port: 8082

spring:
  application:
    name: vehicle-service
  datasource:
    url: jdbc:postgresql://localhost:5433/vehicle
    username: vehicle
    password: vehicle
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: vehicle-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  data:
    redis:
      host: localhost
      port: 6379

app:
  cache:
    # 가용 차량 수 캐싱 실습(docs/availability-cache-lab.md) 전용. 짧게 두는 이유: 배정/보상으로
    # 즉시 무효화되긴 하지만, 무효화 자체를 놓치는 경우(예: 코드 버그)에도 최대 이 시간만큼만
    # stale 데이터가 노출되도록 하는 안전판.
    availability-ttl-seconds: 10
    # 적용 전/후 비교 실습 전용 토글. 평소(true)에는 그냥 켜져 있다.
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

# reservationId(Saga 상관관계 ID)를 MDC에서 읽어 로그 레벨 옆에 노출한다.
# Zipkin 없이도, 이 값으로 여러 서비스의 로그를 grep해서 하나의 Saga 흐름을 추적할 수 있다.
logging:
  pattern:
    level: "%5p [${spring.application.name},%X{reservationId:-}]"
